<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wander Soul | Holidays in India and abroad</title>
    <meta
      name="description"
      content="Wander Soul, Kalyan, Mumbai: holiday packages across India and abroad, and India tours for international visitors (the Golden Triangle, South India and Varanasi). Everything listed, planned with you on WhatsApp."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07121e" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wander Soul" />
    <meta property="og:title" content="Wander Soul | Travel with feeling" />
    <meta property="og:description" content="Holiday packages across India and abroad, with everything listed. Planned with you on WhatsApp." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://videos.pexels.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- On the home page, the first frame of the opening film is requested before the app
         starts (it is the page's largest paint). Same srcset and sizes as the poster in VideoClip. -->
    <script>
      if (location.pathname === '/') {
        var poster = 'https://images.pexels.com/videos/19705899/taj-mahal-taj-mahal-palace-19705899.jpeg?auto=compress&cs=tinysrgb&w=';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.href = poster + '1280';
        link.imageSrcset = [480, 800, 1280, 1920, 2560].map(function (w) { return poster + w + ' ' + w + 'w'; }).join(', ');
        link.imageSizes = '(max-width: 899px) min(178vh, 640px), min(100vw, 960px)';
        document.head.appendChild(link);
      }
    </script>

    <!-- Figtree (in the spirit of Airbnb's and Apple's clean sans) for everything you read
         and tap; Tiro Devanagari Hindi (Tiro Typeworks) for the Hindi words. Only the scripts
         that appear on the page are downloaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
